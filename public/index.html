<!DOCTYPE html><!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<title>Gestione Scaffali</title>
</head>
<body class="bg-gray-100 p-6">

<h1 class="text-3xl font-bold mb-6">Gestione Scaffali</h1>

<div class="grid grid-cols-4 gap-4 mb-4">
  <input id="nome" placeholder="Descrizione" class="p-2 border rounded">
  <input id="spessore" placeholder="Spessore" class="p-2 border rounded">
  <input id="lunghezza" placeholder="Lunghezza" class="p-2 border rounded">
  <input id="larghezza" placeholder="Larghezza" class="p-2 border rounded">
</div>

<div id="results" class="grid grid-cols-3 gap-4"></div>

<hr class="my-8">

<h2 class="text-xl font-bold mb-4">Aggiorna Scaffale</h2>
<input id="scaffaleInput" placeholder="Es: 1b" class="p-2 border rounded">
<button id="apriBtn" class="bg-blue-500 text-white px-4 py-2 rounded">Apri</button>

<div id="scaffaleProdotti" class="mt-6"></div>

<script defer>
let prodotti = []
let scaffaleCorrente = null

async function caricaProdotti(){
  const res = await fetch("/api/prodotti")
  prodotti = await res.json()
}
caricaProdotti()

/* ================= RICERCA ================= */

const fSp = document.getElementById("fSpessore")
const fDesc = document.getElementById("fDescrizione")
const fLu = document.getElementById("fLunghezza")
const fLa = document.getElementById("fLarghezza")

;[fSp,fDesc,fLu,fLa].forEach(i=>i.addEventListener("input", filtra))

function filtra(){
  let sp = fSp.value
  let desc = fDesc.value.toLowerCase()
  let lung = fLu.value
  let larg = fLa.value

  let lista = prodotti.filter(p=>{
    let ok = true
    if(sp) ok = ok && p.spessore == sp
    if(desc) ok = ok && p.nome.toLowerCase().includes(desc)
    if(lung) ok = ok && p.lunghezza == lung
    if(larg) ok = ok && p.larghezza == larg
    return ok
  })

  renderRisultati(lista)
}

function renderRisultati(lista){
  let c = document.getElementById("risultati")
  c.innerHTML = ""

  lista.forEach(p=>{
    c.innerHTML += `
    <div onclick="apriScaffaleDiretto(${p.fila},'${p.scaffale}')"
    class="bg-gray-50 p-4 rounded-xl shadow hover:bg-blue-50 cursor-pointer transition">
    <div class="font-semibold">${p.nome}</div>
    <div>${p.lunghezza}x${p.larghezza} | ${p.spessore}mm</div>
    <div class="text-blue-600 font-bold mt-2">
    Posizione: ${p.fila}${p.scaffale.toUpperCase()}
    </div>
    </div>`
  })
}

/* ================= SCAFFALE ================= */

async function apriScaffaleDiretto(fila,scaffale){
  await caricaProdotti()
  let lista = prodotti.filter(p=>p.fila==fila && p.scaffale==scaffale)

  document.getElementById("titoloScaffale").innerText =
  `Scaffale ${fila}${scaffale.toUpperCase()}`

  scaffaleCorrente = {fila,scaffale}
  lista.sort((a,b)=>a.ripiano-b.ripiano)
  renderLista(lista)
}

function renderLista(lista){
  let container = document.getElementById("listaScaffale")
  container.innerHTML=""

  lista.forEach(p=>{
    container.innerHTML+=`
    <div class="bg-gray-100 p-3 rounded flex justify-between items-center">
    <div>
    <b>${p.nome}</b> (${p.lunghezza}x${p.larghezza} | ${p.spessore}mm) - Ripiano ${p.ripiano}
    </div>
    <div class="flex gap-1">
    <button onclick="elimina(${p.id})" class="bg-red-500 text-white px-2 rounded">❌</button>
    </div>
    </div>`
  })
}

/* ================= CRUD ================= */

async function elimina(id){
  await fetch("/api/prodotti/"+id,{method:"DELETE"})
  apriScaffaleDiretto(scaffaleCorrente.fila,scaffaleCorrente.scaffale)
}
</script>


</body>
</html>
