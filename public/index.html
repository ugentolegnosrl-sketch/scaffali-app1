<!DOCTYPE html><!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<title>Gestione Scaffali</title>
</head>
<body class="bg-gray-100 p-6">

<h1 class="text-3xl font-bold mb-6">Gestione Scaffali</h1>

<div class="grid grid-cols-4 gap-4 mb-4">
  <input id="nome" placeholder="Descrizione" class="p-2 border rounded">
  <input id="spessore" placeholder="Spessore" class="p-2 border rounded">
  <input id="lunghezza" placeholder="Lunghezza" class="p-2 border rounded">
  <input id="larghezza" placeholder="Larghezza" class="p-2 border rounded">
</div>

<div id="results" class="grid grid-cols-3 gap-4"></div>

<hr class="my-8">

<h2 class="text-xl font-bold mb-4">Aggiorna Scaffale</h2>
<input id="scaffaleInput" placeholder="Es: 1b" class="p-2 border rounded">
<button id="apriBtn" class="bg-blue-500 text-white px-4 py-2 rounded">Apri</button>

<div id="scaffaleProdotti" class="mt-6"></div>

<script defer>
let prodotti = []
let scaffaleCorrente = null

/* ================= CARICA ================= */

async function caricaProdotti(){
  const res = await fetch("/api/prodotti")
  prodotti = await res.json()
}

window.addEventListener("load", async () => {
  await caricaProdotti()
  collegaEventi()
})

function collegaEventi(){
  const nome = document.getElementById("nome")
  const spessore = document.getElementById("spessore")
  const lunghezza = document.getElementById("lunghezza")
  const larghezza = document.getElementById("larghezza")

  ;[nome, spessore, lunghezza, larghezza]
    .forEach(el => el.addEventListener("input", filtra))

  document.getElementById("apriBtn")
    .addEventListener("click", apriScaffale)
}

/* ================= RICERCA ================= */

function filtra(){

  const nome = document.getElementById("nome").value.toLowerCase()
  const spessore = document.getElementById("spessore").value
  const lunghezza = document.getElementById("lunghezza").value
  const larghezza = document.getElementById("larghezza").value

  let lista = prodotti.filter(p=>{
    let ok = true

    if(nome) ok = ok && p.nome.toLowerCase().includes(nome)
    if(spessore) ok = ok && p.spessore == spessore
    if(lunghezza) ok = ok && p.lunghezza == lunghezza
    if(larghezza) ok = ok && p.larghezza == larghezza

    return ok
  })

  renderRisultati(lista)
}

function renderRisultati(lista){
  const container = document.getElementById("results")
  container.innerHTML = ""

  lista.forEach(p=>{
    container.innerHTML += `
      <div onclick="apriScaffaleDiretto(${p.fila},'${p.scaffale}')"
      class="bg-gray-50 p-4 rounded-xl shadow hover:bg-blue-50 cursor-pointer transition">
        <div class="font-semibold">${p.nome}</div>
        <div>${p.lunghezza}x${p.larghezza} | ${p.spessore}mm</div>
        <div class="text-blue-600 font-bold mt-2">
          Posizione: ${p.fila}${p.scaffale.toUpperCase()}
        </div>
      </div>
    `
  })
}

/* ================= SCAFFALE ================= */

async function apriScaffale(){
  const input = document.getElementById("scaffaleInput").value.trim().toLowerCase()
  const match = input.match(/^([1-9])([a-z])$/)

  if(!match){
    alert("Formato non valido. Es: 1b")
    return
  }

  apriScaffaleDiretto(parseInt(match[1]), match[2])
}

async function apriScaffaleDiretto(fila, scaffale){

  await caricaProdotti()

  let lista = prodotti.filter(p =>
    p.fila == fila && p.scaffale == scaffale
  )

  scaffaleCorrente = { fila, scaffale }

  lista.sort((a,b)=>a.ripiano-b.ripiano)
  renderLista(lista)
}

function renderLista(lista){

  const container = document.getElementById("scaffaleProdotti")
  container.innerHTML = ""

  if(lista.length === 0){
    container.innerHTML = "<p class='text-gray-500'>Scaffale vuoto</p>"
    return
  }

  lista.forEach(p=>{
    container.innerHTML += `
      <div class="bg-gray-100 p-3 rounded flex justify-between items-center mb-2">
        <div>
          <b>${p.nome}</b>
          (${p.lunghezza}x${p.larghezza} | ${p.spessore}mm)
          - Ripiano ${p.ripiano}
        </div>
        <button onclick="elimina(${p.id})"
          class="bg-red-500 text-white px-2 rounded">
          ❌
        </button>
      </div>
    `
  })
}

/* ================= DELETE ================= */

async function elimina(id){
  await fetch("/api/prodotti/"+id, { method:"DELETE" })

  if(scaffaleCorrente){
    apriScaffaleDiretto(
      scaffaleCorrente.fila,
      scaffaleCorrente.scaffale
    )
  }
}
</script>



</body>
</html>
